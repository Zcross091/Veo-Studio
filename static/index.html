<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Veo Studio</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --card:#1d212b;
    --line:#272b35;
    --text:#e8eaf0;
    --muted:#8b92a3;
    --accent:#7c9cff;
    --user:#232a3d;
    --error:#f87171;
    --success:#4ade80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;
    background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:max(12px, env(safe-area-inset-top)) 16px 12px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    flex-shrink:0;
  }
  header h1{
    font-size:16px;margin:0;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .tag{
    font-size:11px;background:#242a38;color:var(--accent);
    padding:2px 8px;border-radius:12px;font-weight:500;
  }
  .ghost{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:8px;cursor:pointer;
    font-size:13px;font-weight:500;min-height:38px;
    touch-action:manipulation;transition:all .15s;
  }
  .ghost:hover,.ghost:active{color:var(--text);border-color:var(--muted)}
  .ghost:disabled{opacity:0.5;cursor:not-allowed}

  #settings{
    display:none;padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;max-height:55vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #settings.open{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;
  }
  label{
    display:flex;flex-direction:column;gap:5px;
    font-size:12px;color:var(--muted);
  }
  input,select,textarea{
    background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:16px; /* 16px prevents iOS Safari auto-zoom */
    font-family:inherit;min-height:42px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

  #chat{
    flex:1;overflow-y:auto;padding:16px;
    max-width:860px;width:100%;margin:0 auto;
    -webkit-overflow-scrolling:touch;
  }
  .empty{
    color:var(--muted);text-align:center;
    margin-top:14vh;font-size:14px;line-height:1.6;
    padding:0 16px;
  }
  .msgs{margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
  .bubble{
    padding:14px 16px;border-radius:14px;
    max-width:92%;white-space:pre-wrap;word-break:break-word;
  }
  .user{background:var(--user);align-self:flex-end;border-bottom-right-radius:4px}
  .bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;width:100%;border-bottom-left-radius:4px}
  .status{font-weight:600;margin-bottom:8px;font-size:14px}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width .4s ease}
  .log{
    color:var(--muted);font-size:11px;margin:10px 0 0;
    white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    max-height:130px;overflow-y:auto;background:rgba(0,0,0,0.3);
    padding:8px 10px;border-radius:6px;word-break:break-all;
    -webkit-overflow-scrolling:touch;
  }
  .player{
    width:100%;margin-top:12px;border-radius:10px;
    background:#000;max-height:65vh;
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .dl{
    display:inline-flex;align-items:center;justify-content:center;
    gap:6px;color:var(--accent);text-decoration:none;
    font-weight:500;padding:8px 14px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;min-height:42px;
    touch-action:manipulation;
  }
  .dl:hover,.dl:active{background:#1f2533}
  .cancel-btn{
    background:#2a1b1b;border:1px solid #5a2626;color:#fca5a5;
    padding:8px 14px;border-radius:8px;cursor:pointer;
    font-size:13px;min-height:42px;touch-action:manipulation;
    transition:all .15s;
  }
  .cancel-btn:hover,.cancel-btn:active{background:#3b1f1f}
  .cancel-btn:disabled{opacity:0.6;cursor:not-allowed}

  form{
    border-top:1px solid var(--line);
    padding:10px 14px max(14px, env(safe-area-inset-bottom));
    background:var(--panel);flex-shrink:0;
  }
  .row{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:10px 12px;border-radius:10px}
  .send{
    background:var(--accent);color:#0b0e16;border:0;
    border-radius:10px;padding:12px 20px;font-weight:600;
    font-size:14px;cursor:pointer;min-height:46px;
    touch-action:manipulation;display:flex;align-items:center;justify-content:center;
  }
  .send:active{transform:scale(0.97)}
  .hint{max-width:860px;margin:6px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.35}

  /* Phone screen optimizations */
  @media (max-width:640px){
    header h1{font-size:15px}
    .tag{display:none}
    #settings.open{
      grid-template-columns:1fr;
      max-height:65vh;
      gap:10px;
      padding:12px 14px;
    }
    #chat{padding:12px 10px}
    .bubble{max-width:96%;padding:12px 14px}
    .actions .dl, .actions .cancel-btn{flex:1;text-align:center}
    .send{padding:12px 16px}
  }
</style>
</head>
<body>
<header>
  <h1>Veo Studio <span class="tag">Veo 3.1 & Omni</span></h1>
  <button class="ghost" id="toggle" type="button">Settings</button>
</header>

<section id="settings">
  <label>Video model
    <select id="model">
      <option value="veo_3_1" selected>Google Veo 3.1 (via GenRelay) [Recommended]</option>
      <option value="fal-ai/minimax-video/text-to-video">MiniMax Video-01 (via Fal.ai)</option>
      <option value="fal-ai/kling-video/v1/standard/text-to-video">Kling 1.0 (via Fal.ai)</option>
      <option value="fal-ai/luma-dream-machine">Luma Dream Machine (via Fal.ai)</option>
      <option value="gemini-omni-1.1-flash">Gemini Omni 1.1 Flash (Google Direct)</option>
    </select>
  </label>
  <label>Video length
    <select id="secs">
      <option value="16">~16 seconds (2 clips - quick test)</option>
      <option value="32">~32 seconds (4 clips)</option>
      <option value="60" selected>~1 minute (7-8 clips)</option>
      <option value="90">~1.5 minutes</option>
      <option value="120">~2 minutes</option>
      <option value="180">~3 minutes (max)</option>
    </select>
  </label>
  <label>Aspect ratio
    <select id="aspect"><option value="16:9" selected>16:9 Landscape</option><option value="9:16">9:16 Portrait (Shorts/Reels)</option></select>
  </label>
  <label>Quality
    <select id="resolution"><option value="720p" selected>720p HD</option><option value="1080p">1080p Full HD</option></select>
  </label>
  <label>Visual Style
    <input id="style" value="Cinematic animation, consistent character design, rich lighting">
  </label>
  <label>Scene planner model
    <input id="planner" value="gemini-3.5-flash-lite">
  </label>
  <label>GenRelay API Key (for Veo 3.1)
    <input id="genrelay_key" type="password" placeholder="Loaded from .env if present" autocomplete="off">
  </label>
  <label>Fal.ai API Key (for MiniMax, Kling, Luma)
    <input id="fal_key" type="password" placeholder="Loaded from .env if present" autocomplete="off">
  </label>
  <label>Gemini API Key (for Planner/Omni)
    <input id="gemini_key" type="password" placeholder="Loaded from .env if present" autocomplete="off">
  </label>
</section>

<main id="chat">
  <div class="empty" id="empty">
    Describe the video or scene you want to generate.<br>
    Frontier AI models create clips chained seamlessly shot-by-shot.
  </div>
</main>

<form id="form">
  <div class="row">
    <textarea id="prompt" placeholder="e.g. A tiny robot gardener restoring a glowing ancient sanctuary..." rows="1"></textarea>
    <button class="send" type="submit">Generate</button>
  </div>
  <div class="hint" id="hint"></div>
</form>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat');
const cards = {};

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function ensureCard(job){
  if (cards[job.id]) return cards[job.id];
  $('#empty')?.remove();
  const wrap = el('div', 'msgs');
  const u = el('div', 'bubble user', job.prompt);
  const a = el('div', 'bubble bot');
  const status = el('div', 'status');
  const bar = el('div', 'bar'); const fill = el('div', 'fill'); bar.appendChild(fill);
  const log = el('pre', 'log');
  const media = el('div', 'media');
  const actions = el('div', 'actions');
  const cancel = el('button', 'cancel-btn', 'Cancel');
  cancel.type = 'button';
  cancel.onclick = async () => {
    cancel.disabled = true;
    cancel.textContent = 'Cancelling...';
    try {
      await fetch('/api/jobs/' + job.id + '/cancel', {method: 'POST'});
    } catch (e) {
      console.error(e);
    }
    poll(job.id);
  };
  actions.appendChild(cancel);
  a.append(status, bar, log, media, actions);
  wrap.append(u, a);
  chat.appendChild(wrap);
  return cards[job.id] = {status, fill, log, media, cancel, actions, shown: null};
}

function render(job){
  const c = ensureCard(job);
  c.status.textContent = job.message;
  c.fill.style.width = (job.total ? Math.min(100, Math.round(100 * job.done_steps / job.total)) : 0) + '%';
  c.log.textContent = job.log.slice(-10).join('\n');
  c.log.scrollTop = c.log.scrollHeight;

  c.cancel.style.display = (job.status === 'running') ? '' : 'none';

  if (job.video_url){
    const vUrl = job.video_url + '?t=' + (job.done_steps || 1);
    if (c.shown !== vUrl){
      c.media.textContent = '';
      const v = document.createElement('video');
      v.src = vUrl;
      v.controls = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.className = 'player';
      const durationSecs = Math.round((job.done_steps || 1) * 8);
      const dl = el('a', 'dl', `Download MP4 (~${durationSecs}s)`);
      dl.href = job.video_url;
      dl.download = `veo_${job.id}.mp4`;
      c.media.append(v, dl);
      c.shown = vUrl;
    }
  }
  chat.scrollTop = chat.scrollHeight;
}

async function poll(id){
  try {
    const res = await fetch('/api/jobs/' + id);
    if (!res.ok) return;
    const job = await res.json();
    render(job);
    if (job.status === 'running') {
      setTimeout(() => poll(id), 2500);
    }
  } catch (e) {
    setTimeout(() => poll(id), 4000);
  }
}

function updateHint(){
  const secs = +$('#secs').value;
  const n = Math.ceil(secs / 8);
  const m = $('#model').value;
  const prov = m.startsWith('veo_') ? 'GenRelay Veo 3.1' : m.startsWith('fal-ai/') ? 'Fal.ai' : 'Google Direct Omni';
  $('#hint').textContent = `Target ~${secs}s video (up to ${n} clips chained seamlessly via ${prov}).`;
}

$('#toggle').onclick = () => $('#settings').classList.toggle('open');
$('#secs').onchange = updateHint;
$('#model').onchange = updateHint;

$('#prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#form').requestSubmit(); }
});

$('#form').onsubmit = async e => {
  e.preventDefault();
  const prompt = $('#prompt').value.trim();
  if (!prompt) return;
  const secs = +$('#secs').value;

  const body = {
    prompt,
    seconds: secs,
    aspect: $('#aspect').value,
    resolution: $('#resolution').value,
    style: $('#style').value.trim(),
    model: $('#model').value.trim(),
    planner: $('#planner').value.trim(),
    gemini_key: $('#gemini_key').value.trim(),
    genrelay_key: $('#genrelay_key').value.trim(),
    fal_key: $('#fal_key').value.trim()
  };

  const r = await fetch('/api/jobs', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const job = await r.json();
  if (!r.ok){
    alert(job.error || 'Could not start generation job');
    return;
  }
  $('#prompt').value = '';
  render(job);
  poll(job.id);
};

(async () => {
  try {
    const cfg = await (await fetch('/api/config')).json();
    if (cfg.model) $('#model').value = cfg.model;
    if (cfg.planner) $('#planner').value = cfg.planner;
    if (!cfg.has_key) $('#settings').classList.add('open');
    updateHint();
    const jobs = await (await fetch('/api/jobs')).json();
    jobs.forEach(j => {
      render(j);
      if (j.status === 'running') poll(j.id);
    });
  } catch (err) {
    console.error('Config fetch failed:', err);
  }
})();
</script>
</body>
</html>
